<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f0e8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>MY CLOSET</title>
<style>
:root{--bg:#f7f4ee;--card:#fffdf9;--ink:#39352f;--muted:#8d857a;--line:#e9e2d8;--accent:#b69b7c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
header{padding:26px 20px 16px;position:sticky;top:0;background:rgba(247,244,238,.96);backdrop-filter:blur(12px);z-index:2;border-bottom:1px solid var(--line)}
.brand{font-family:Georgia,serif;letter-spacing:3px;font-size:24px}.sub{font-size:11px;color:var(--muted);letter-spacing:1.8px;margin-top:5px}
main{padding:18px 16px 110px;max-width:760px;margin:auto}
.stats{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 18px}.stats strong{font-size:23px}.stats span{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar input{flex:1;min-width:0}
input,select,button{font:inherit}input,select{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);width:100%;outline:none}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative}
.item img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#eee8df}
.item .info{padding:10px 11px 12px}.name{font-size:14px;font-weight:600;margin-bottom:5px}.tags{font-size:11px;color:var(--muted);line-height:1.6}
.del{position:absolute;right:8px;top:8px;border:0;border-radius:99px;background:rgba(255,253,249,.9);width:30px;height:30px;color:#655d54}
.empty{grid-column:1/-1;text-align:center;padding:55px 20px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:18px;line-height:1.8}
nav{position:fixed;bottom:0;left:0;right:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(255,253,249,.96);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:3}
nav button{border:0;background:transparent;color:var(--muted);padding:10px 28px;font-size:13px}nav button.active{color:var(--ink);font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 14px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px 2px}
.primary{background:var(--ink);color:white;border:0;border-radius:13px;padding:14px 18px;width:100%;font-weight:600}
.secondary{background:#eee7dc;color:var(--ink);border:0;border-radius:12px;padding:10px 14px}
.note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:12px}
.hidden{display:none!important}
#preview{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:#f1ece4;margin:8px 0}
.colors{display:flex;flex-wrap:wrap;gap:7px}.colorchip{border:1px solid var(--line);border-radius:99px;padding:7px 11px;background:var(--card);font-size:12px}.colorchip.selected{background:#e9dfd1;border-color:var(--accent)}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header><div class="brand">MY CLOSET</div><div class="sub">YOUR PERSONAL WARDROBE</div></header>
<main>
<section id="home">
 <div class="stats"><div><strong id="count">0</strong> <span>개의 아이템</span></div><span>나만의 작은 옷장</span></div>
 <div class="toolbar"><input id="search" placeholder="옷 이름 검색" aria-label="옷 이름 검색"></div>
 <div class="filters">
  <select id="catFilter"><option value="">전체 카테고리</option><option>상의</option><option>하의</option><option>원피스</option><option>아우터</option><option>신발</option><option>가방</option><option>액세서리</option></select>
  <select id="seasonFilter"><option value="">전체 계절</option><option>봄</option><option>여름</option><option>가을</option><option>겨울</option><option>사계절</option></select>
 </div>
 <div class="colors" id="colorFilters" style="margin-bottom:16px"></div>
 <div class="grid" id="items"></div>
</section>
<section id="add" class="hidden">
 <div class="panel">
  <h2>새 옷 등록하기</h2>
  <div class="field"><label>옷 사진</label><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview" class="hidden" alt="선택한 옷 미리보기"></div>
  <div class="field"><label>이름 (선택)</label><input id="name" placeholder="예: 베이지 니트"></div>
  <div class="field"><label>카테고리</label><select id="category"><option>상의</option><option>하의</option><option>원피스</option><option>아우터</option><option>신발</option><option>가방</option><option>액세서리</option></select></div>
  <div class="field"><label>색상</label><select id="color"><option>검정</option><option>흰색</option><option>회색</option><option>베이지</option><option>갈색</option><option>빨강</option><option>주황</option><option>노랑</option><option>초록</option><option>파랑</option><option>보라</option><option>분홍</option><option>기타</option></select></div>
  <div class="field"><label>계절</label><select id="season"><option>봄</option><option>여름</option><option>가을</option><option>겨울</option><option>사계절</option></select></div>
  <button class="primary" id="save">옷장에 저장하기</button>
  <div class="note">사진과 등록 정보는 이 브라우저의 기기 저장공간에 보관됩니다. 브라우저 데이터 삭제 또는 앱/사이트 데이터 초기화 전에 별도 백업이 필요합니다.</div>
 </div>
</section>
<section id="category" class="hidden">
 <div class="panel"><h2>카테고리별 옷장</h2><div class="grid" id="categoryButtons"></div></div>
</section>
</main>
<nav><button id="homeTab" class="active">옷장</button><button id="categoryTab">카테고리</button><button id="addTab">＋ 옷 등록</button></nav>
<script>
const DB='mycloset-local-v1', STORE='clothes';let db,photoBlob=null,activeColor='';
const colors=['전체','검정','흰색','회색','베이지','갈색','빨강','주황','노랑','초록','파랑','보라','분홍','기타'];
const categories=['상의','하의','원피스','아우터','신발','가방','액세서리'];
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function all(){return new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(v){return new Promise((res,rej)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).add(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function remove(id){return new Promise((res,rej)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function show(which){['home','add','category'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==which));['homeTab','addTab','categoryTab'].forEach(x=>document.getElementById(x).classList.toggle('active',x===which+'Tab'));if(which==='home')render()}
document.getElementById('homeTab').onclick=()=>show('home');document.getElementById('addTab').onclick=()=>show('add');document.getElementById('categoryTab').onclick=()=>show('category');
document.getElementById('photo').onchange=e=>{let f=e.target.files[0];if(!f)return;photoBlob=f;let u=URL.createObjectURL(f),p=document.getElementById('preview');p.src=u;p.classList.remove('hidden')};
document.getElementById('save').onclick=async()=>{if(!photoBlob){alert('옷 사진을 먼저 선택해 주세요.');return}let name=document.getElementById('name').value.trim()||document.getElementById('category').value;await put({photo:photoBlob,name,category:document.getElementById('category').value,color:document.getElementById('color').value,season:document.getElementById('season').value,created:Date.now()});photoBlob=null;document.getElementById('photo').value='';document.getElementById('name').value='';document.getElementById('preview').classList.add('hidden');alert('옷장에 저장했어요!');show('home')};
function renderColorFilters(){let el=document.getElementById('colorFilters');el.innerHTML='';colors.forEach(c=>{let b=document.createElement('button');b.className='colorchip'+((c==='전체'&&!activeColor)||(c===activeColor)?' selected':'');b.textContent=c;b.onclick=()=>{activeColor=c==='전체'?'':c;render()};el.append(b)})}
async function render(){let data=await all(),q=document.getElementById('search').value.toLowerCase(),cat=document.getElementById('catFilter').value,sea=document.getElementById('seasonFilter').value;data=data.filter(x=>(!q||x.name.toLowerCase().includes(q))&&(!cat||x.category===cat)&&(!sea||x.season===sea)&&(!activeColor||x.color===activeColor));document.getElementById('count').textContent=(await all()).length;renderColorFilters();let grid=document.getElementById('items');grid.innerHTML='';if(!data.length){grid.innerHTML='<div class="empty">아직 등록된 옷이 없거나<br>검색 결과가 없어요.<br>아래 “＋ 옷 등록”에서 시작해 보세요.</div>';return}data.sort((a,b)=>b.created-a.created).forEach(x=>{let card=document.createElement('article');card.className='item';let img=document.createElement('img');img.src=URL.createObjectURL(x.photo);img.alt=x.name;let del=document.createElement('button');del.className='del';del.textContent='×';del.onclick=async()=>{if(confirm('이 옷을 삭제할까요?')){await remove(x.id);render()}};let info=document.createElement('div');info.className='info';let n=document.createElement('div');n.className='name';n.textContent=x.name;let t=document.createElement('div');t.className='tags';t.textContent=`${x.category} · ${x.color} · ${x.season}`;info.append(n,t);card.append(img,del,info);grid.append(card)})}
document.getElementById('search').oninput=render;document.getElementById('catFilter').onchange=render;document.getElementById('seasonFilter').onchange=render;
document.getElementById('categoryButtons').innerHTML=categories.map(c=>`<button class="secondary" style="min-height:64px" data-cat="${c}">${c}</button>`).join('');
document.getElementById('categoryButtons').onclick=e=>{let c=e.target.dataset.cat;if(c){document.getElementById('catFilter').value=c;show('home')}};
openDB().then(render).catch(()=>alert('이 브라우저에서 저장공간을 열 수 없어요. Safari에서 다시 열어 주세요.'));
</script>
<script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {})); }</script>
</body></html>
