<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f0e9"><link rel="manifest" href="./manifest.webmanifest"><title>MY CLOSET</title>
<style>
:root{--bg:#f4f0e9;--paper:#fffdf9;--ink:#292621;--muted:#817b72;--line:#ded7cc;--soft:#e9e2d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{padding:40px 22px 22px;border-bottom:1px solid var(--line)}h1{font: bold 38px Georgia,serif;letter-spacing:3px;margin:0 0 8px}.tag{font-size:12px;letter-spacing:3px;color:var(--muted)}main{padding:20px 16px 50px;max-width:900px;margin:auto}.count{display:flex;justify-content:space-between;align-items:center;color:var(--muted);margin-bottom:22px}.count strong{font-size:34px;color:var(--ink)}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button{border:0;border-radius:16px;padding:13px 15px;background:var(--soft);color:var(--ink);font-size:15px}button.dark{background:var(--ink);color:white}button:disabled{opacity:.4}input[type=text]{width:100%;padding:15px;border:1px solid var(--line);border-radius:16px;background:var(--paper);font-size:16px;margin:5px 0 14px}.folders{display:flex;gap:8px;overflow:auto;padding:3px 0 14px}.folder{white-space:nowrap;border:1px solid var(--line)}.folder.active{background:var(--ink);color:white}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.tile{position:relative;aspect-ratio:1;background:#e8e2d9;border-radius:10px;overflow:hidden}.tile img{width:100%;height:100%;object-fit:cover}.tile input{position:absolute;top:6px;left:6px;width:20px;height:20px}.empty{grid-column:1/-1;text-align:center;padding:45px 10px;color:var(--muted);line-height:1.8}.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:22px}#viewer{display:none;position:fixed;inset:0;background:#000e;z-index:5;align-items:center;justify-content:center;padding:20px}#viewer img{max-width:100%;max-height:80vh;object-fit:contain}#viewer button{position:absolute;top:20px;right:20px}#viewer .remove{top:auto;bottom:20px}dialog{border:0;border-radius:18px;padding:22px;width:88%;background:var(--paper)}dialog::backdrop{background:#0007}@media(min-width:600px){.grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}}
</style></head><body>
<header><h1>MY CLOSET</h1><div class="tag">YOUR PERSONAL PHOTO LIBRARY</div></header><main>
<div class="count"><div><strong id="count">0</strong> 장의 사진</div><span id="label">전체 사진</span></div>
<div class="bar"><button class="dark" id="newFolder">＋ 폴더</button><button id="rename">이름 변경</button><button class="dark" id="add">＋ 여러 장 사진 추가</button><input id="files" type="file" accept="image/*" multiple hidden></div>
<div class="folders" id="folders"></div><input id="search" type="text" placeholder="사진 검색">
<div class="bar"><button id="all">전체 선택</button><button id="move" disabled>선택 사진 이동</button><button id="clear">선택 해제</button><button id="delete" disabled>선택 삭제</button></div>
<div class="grid" id="grid"></div><div class="note">사진은 이 기기의 웹 저장공간에 보관됩니다. 중요한 원본은 아이폰 사진 앱에도 보관해 주세요. 앱이나 웹사이트 데이터를 삭제하면 사진이 사라질 수 있습니다.</div>
</main><div id="viewer"><button id="close">닫기</button><img><button class="remove" id="removeOne">이 사진 삭제</button></div>
<dialog id="dlg"><form method="dialog"><h3 id="dlgTitle">새 폴더</h3><input id="folderName" type="text" placeholder="폴더 이름" required><div class="bar"><button value="cancel">취소</button><button class="dark" id="save" value="ok">저장</button></div></form></dialog>
<script>
(()=>{'use strict';
const DB='mycloset-new-v1';let db,folder='all',selected=new Set(),current=null,edit=null,urls=[];
const $=x=>document.getElementById(x);
function req(r){return new Promise((a,b)=>{r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)})}
async function openDB(){return new Promise((a,b)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('folders'))d.createObjectStore('folders',{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)})}
function store(n,m='readonly'){return db.transaction(n,m).objectStore(n)}
const getAll=n=>req(store(n).getAll()),get=(n,id)=>req(store(n).get(id)),add=(n,v)=>req(store(n,'readwrite').add(v)),put=(n,v)=>req(store(n,'readwrite').put(v)),del=(n,id)=>req(store(n,'readwrite').delete(id));
function btns(){$('move').disabled=!selected.size;$('delete').disabled=!selected.size}
async function draw(){urls.forEach(URL.revokeObjectURL);urls=[];let [ps,fs]=await Promise.all([getAll('photos'),getAll('folders')]);$('folders').innerHTML='';
function tab(id,name){let b=document.createElement('button');b.className='folder'+(folder===id?' active':'');b.textContent=name;b.onclick=()=>{folder=id;selected.clear();draw()};$('folders').append(b)}
tab('all','전체 사진');fs.forEach(f=>tab(f.id,f.name));$('label').textContent=folder==='all'?'전체 사진':(fs.find(f=>f.id===folder)?.name||'폴더');
let q=$('search').value.toLowerCase().trim(),list=ps.filter(x=>(folder==='all'||x.folder===folder)&&(!q||x.name.toLowerCase().includes(q)));$('count').textContent=list.length;$('grid').innerHTML='';
if(!list.length)$('grid').innerHTML='<div class="empty">아직 사진이 없어요.<br>“여러 장 사진 추가”를 눌러 사진을 넣어주세요.</div>';
for(let x of list){let d=document.createElement('div');d.className='tile';let im=document.createElement('img'),u=URL.createObjectURL(x.blob);urls.push(u);im.src=u;im.onclick=()=>view(x.id);let c=document.createElement('input');c.type='checkbox';c.checked=selected.has(x.id);c.onchange=()=>{c.checked?selected.add(x.id):selected.delete(x.id);btns()};d.append(im,c);$('grid').append(d)}btns()}
async function view(id){current=await get('photos',id);$('viewer').querySelector('img').src=URL.createObjectURL(current.blob);$('viewer').style.display='flex'}
$('close').onclick=()=>{$('viewer').style.display='none';$('viewer').querySelector('img').src='';current=null};
$('add').onclick=()=>$('files').click();$('files').onchange=async e=>{for(let f of [...e.target.files])if(f.type.startsWith('image/'))await add('photos',{name:f.name,blob:f,folder:folder==='all'?null:folder});e.target.value='';draw()};
$('newFolder').onclick=()=>{edit=null;$('dlgTitle').textContent='새 폴더';$('folderName').value='';$('dlg').showModal()};
$('rename').onclick=async()=>{if(folder==='all')return alert('이름을 바꿀 폴더를 먼저 선택해 주세요.');edit=folder;let f=await get('folders',folder);$('dlgTitle').textContent='폴더 이름 변경';$('folderName').value=f?.name||'';$('dlg').showModal()};
$('save').onclick=async e=>{e.preventDefault();let name=$('folderName').value.trim();if(!name)return;if(edit!==null){let f=await get('folders',edit);if(f){f.name=name;await put('folders',f)}}else await add('folders',{name});$('dlg').close();draw()};
$('all').onclick=async()=>{(await getAll('photos')).filter(x=>folder==='all'||x.folder===folder).forEach(x=>selected.add(x.id));draw()};
$('clear').onclick=()=>{selected.clear();draw()};
$('move').onclick=async()=>{let fs=await getAll('folders');if(!fs.length)return alert('먼저 폴더를 만들어 주세요.');let n=prompt('이동할 폴더 번호를 입력하세요:\n'+fs.map((f,i)=>(i+1)+'. '+f.name).join('\n'));let f=fs[Number(n)-1];if(!f)return;for(let id of selected){let x=await get('photos',id);if(x){x.folder=f.id;await put('photos',x)}}selected.clear();draw()};
$('delete').onclick=async()=>{if(!confirm('선택한 사진을 삭제할까요?'))return;for(let id of selected)await del('photos',id);selected.clear();draw()};
$('removeOne').onclick=async()=>{if(current&&confirm('이 사진을 삭제할까요?')){await del('photos',current.id);$('close').click();draw()}};
$('search').oninput=draw;
(async()=>{try{db=await openDB();await draw()}catch(e){console.error(e);alert('저장공간을 열지 못했어요. Safari에서 이 주소를 열어주세요.')}})();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
